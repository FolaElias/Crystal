version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: crystal-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: crystal

  redis:
    image: redis:7-alpine
    container_name: crystal-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mongo-express:
    image: mongo-express:latest
    container_name: crystal-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongo

volumes:
  mongo_data:
  redis_data:
